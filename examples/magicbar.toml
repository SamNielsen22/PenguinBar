# magicbar config. Copy to ~/.config/magicbar/magicbar.toml and edit.
# The bar redraws as soon as you save.
#
# The bar is laid out like Apple's: esc on the left, the focused app's
# keys in the middle, and the Control Strip on the right. Tap the strip's
# chevron to expand it over the app's keys, and the x to close it again.
#
# A key has a label and either a key to press or a command to run.
# Key names are the Linux ones, like KEY_VOLUMEUP. Labels can be text
# or Nerd Font icons. Keys in a group share one plate.

# Far left in every layout.
esc = { label = "esc", key = "KEY_ESC" }

[strip]
# Always visible next to an app's keys.
collapsed = [
    { label = "󰖙", key = "KEY_BRIGHTNESSDOWN" },
    { label = "󰖨", key = "KEY_BRIGHTNESSUP" },
    { label = "󰕿", key = "KEY_VOLUMEDOWN" },
    { label = "󰕾", key = "KEY_VOLUMEUP" },
]
# The full strip, shown after tapping the chevron.
expanded = [
    [
        { label = "󰖙", key = "KEY_BRIGHTNESSDOWN" },
        { label = "󰖨", key = "KEY_BRIGHTNESSUP" },
    ],
    [
        { label = "󰌌 -", key = "KEY_KBDILLUMDOWN" },
        { label = "󰌌 +", key = "KEY_KBDILLUMUP" },
    ],
    [
        { label = "󰑟", key = "KEY_PREVIOUSSONG" },
        { label = "󰐎", key = "KEY_PLAYPAUSE" },
        { label = "󰈑", key = "KEY_NEXTSONG" },
    ],
    [
        { label = "󰸈", key = "KEY_MUTE" },
        { label = "󰕿", key = "KEY_VOLUMEDOWN" },
        { label = "󰕾", key = "KEY_VOLUMEUP" },
    ],
]

# App keys fill the middle while one of these apps is focused.
# Find an app's class with: hyprctl activewindow
[layouts.browser]
apps = ["firefox", "chromium"]
groups = [
    [
        { label = "󰁍", key = "KEY_BACK" },
        { label = "󰁔", key = "KEY_FORWARD" },
        { label = "󰑐", key = "KEY_REFRESH" },
    ],
    # A command runs in a shell instead of pressing a key.
    [{ label = "󰹑", command = "grim ~/Pictures/screenshot.png" }],
]
