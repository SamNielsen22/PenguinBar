# magicbar config. Copy to ~/.config/magicbar/magicbar.toml and edit.
# The bar redraws as soon as you save.
#
# The bar is laid out like Apple's: esc on the left, the focused app's
# keys in the middle, and the Control Strip on the right. Tap the strip's
# chevron to expand it over the app's keys, and the x to close it again.
#
# A key has a label and one of: a key to press, like KEY_VOLUMEUP; a
# command to run in a shell, like command = "playerctl next"; or a slider,
# one of brightness, volume and keyboard. Tap a slider key to open the
# slider, or hold it and slide. Labels can be text or Nerd Font icons.
# Keys in a group share one plate.
#
# { widget = "media" } is play or pause and a bar you can drag, shown while
# the focused window is playing something.

# Far left in every layout.
esc = { label = "esc", key = "KEY_ESC" }

[strip]
# Always visible next to an app's keys.
collapsed = [
    { label = "󰖨", slider = "brightness" },
    { label = "󰕾", slider = "volume" },
    { label = "󰌌", slider = "keyboard" },
]
# The full strip, shown after tapping the chevron.
expanded = [
    [
        { label = "󰖙", key = "KEY_BRIGHTNESSDOWN" },
        { label = "󰖨", key = "KEY_BRIGHTNESSUP" },
    ],
    [
        { label = "󰌌 -", key = "KEY_KBDILLUMDOWN" },
        { label = "󰌌 +", key = "KEY_KBDILLUMUP" },
    ],
    [
        { label = "󰑟", key = "KEY_PREVIOUSSONG" },
        { label = "󰐎", key = "KEY_PLAYPAUSE" },
        { label = "󰈑", key = "KEY_NEXTSONG" },
    ],
    [
        { label = "󰸈", key = "KEY_MUTE" },
        { label = "󰕿", key = "KEY_VOLUMEDOWN" },
        { label = "󰕾", key = "KEY_VOLUMEUP" },
    ],
]

# Shown for every app. An app's own layout adds its keys after these.
[layouts.default]
groups = [[{ widget = "media" }]]

# Keys only this app gets. Find an app's class with: hyprctl activewindow
[layouts.browser]
apps = ["firefox", "chromium"]
groups = [
    [
        { label = "󰁍", key = "KEY_BACK" },
        { label = "󰁔", key = "KEY_FORWARD" },
        { label = "󰑐", key = "KEY_REFRESH" },
    ],
]

[layouts.editor]
apps = ["code"]
groups = [
    [
        { label = "", key = "KEY_F5" },
        { label = "", key = "KEY_F10" },
        { label = "", key = "KEY_F11" },
    ],
]
