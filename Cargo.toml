[package]
name = "penguinbar"
version = "0.1.0"
edition = "2021"
description = "App-aware Touch Bar daemon for Linux"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
cairo-rs = { version = "0.22.9", features = ["png"] }
clap = { version = "4.6.7", features = ["derive"] }
drm = "0.15.0"
evdev = "0.13.2"
mpris = "2.1.0"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

